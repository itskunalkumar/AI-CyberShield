<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AI-CyberShield</title>
  <desc id="d">Animated banner: a glowing 3D-style shield with orbiting rings above the words AI-CyberShield.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030711"/><stop offset=".55" stop-color="#07142a"/><stop offset="1" stop-color="#0b1030"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eaf9ff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".95"/><stop offset=".55" stop-color="#2563eb" stop-opacity=".85"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".95"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#22d3ee" stroke-opacity=".09" stroke-width="1"/></pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1280" height="420" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect y="-120" width="1280" height="120" fill="url(#beam)"><animate attributeName="y" from="-120" to="420" dur="6s" repeatCount="indefinite"/></rect>

    <!-- shield -->
    <g transform="translate(235 205)">
      <circle r="190" fill="url(#halo)"><animate attributeName="r" values="170;200;170" dur="4s" repeatCount="indefinite"/></circle>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <ellipse rx="170" ry="52" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="4 8"/>
        <circle cx="170" r="6" fill="#22d3ee" filter="url(#glow)"/></g>
      <g transform="rotate(62)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
        <ellipse rx="160" ry="46" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="2 9"/>
        <circle cx="-160" r="5" fill="#a78bfa" filter="url(#glow)"/></g></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4s" repeatCount="indefinite"/>
        <path d="M0,-118 C44,-94 86,-86 108,-90 L108,-6 C108,64 56,106 0,132 C-56,106 -108,64 -108,-6 L-108,-90 C-86,-86 -44,-94 0,-118 Z" fill="url(#sg)" fill-opacity=".28" stroke="#9ef2ff" stroke-width="2.5" filter="url(#glow)"/>
        <path d="M0,-96 C36,-76 70,-70 88,-73 L88,-4 C88,54 46,88 0,109 C-46,88 -88,54 -88,-4 L-88,-73 C-70,-70 -36,-76 0,-96 Z" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
        <path d="M-42,2 L-12,32 L46,-30" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <rect x="-78" y="-40" width="156" height="3" rx="2" fill="#fff" fill-opacity=".8" filter="url(#glow)"><animate attributeName="y" values="-70;80;-70" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.9;.1" dur="3.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- text -->
    <text x="470" y="185" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="1" fill="url(#tg)" filter="url(#glow)">AI-CyberShield</text>
    <rect x="474" y="207" width="520" height="3" rx="2" fill="url(#tg)"><animate attributeName="width" values="40;520;40" dur="5s" repeatCount="indefinite"/></rect>
    <text x="472" y="256" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="27" fill="#b9d6ee">ML-powered cybersecurity smart controller</text>
    <text x="472" y="291" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="27" fill="#b9d6ee">for grid-connected microgrids</text>
    <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#22d3ee">
      <text x="472" y="345">XGBoost  ·  Isolation Forest  ·  SHAP  ·  FastAPI  ·  Streamlit  ·  PostgreSQL</text>
    </g>

    <!-- particles -->
    <g fill="#60a5fa">
      <circle cx="1120" cy="90" r="2.5"><animate attributeName="cy" values="90;60;90" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1190" cy="250" r="3"><animate attributeName="cy" values="250;280;250" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="340" r="2"><animate attributeName="cy" values="340;310;340" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="60" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1230" cy="150" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="1" y="1" width="1278" height="418" rx="25" fill="none" stroke="#22d3ee" stroke-opacity=".25"/>
  </g>
</svg>
